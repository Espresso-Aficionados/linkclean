# Informational, never a required check.
name: fuzz
on:
  schedule: [{cron: "41 3 * * *"}]
  workflow_dispatch: {}
  pull_request: {paths: ["**.go"]}
permissions: {contents: read}
jobs:
  fuzz:
    # go test -fuzz takes one package, so each target names its own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: FuzzClean,        pkg: .}
          - {target: FuzzCleanAmended, pkg: .}
          - {target: FuzzUnwrap,       pkg: .}
          - {target: FuzzRoundCap,     pkg: .}
          - {target: FuzzExtraUnwrap,  pkg: .}
          - {target: FuzzHostView,     pkg: ./internal/rawurl}
          - {target: FuzzReserialize,  pkg: ./internal/rawurl}
          - {target: FuzzQuery,        pkg: ./internal/query}
          - {target: FuzzMatchPattern, pkg: ./internal/matchpattern}
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: "1.26.x"}
      - run: go test -run '^$' -fuzz "^${{ matrix.target }}$" -fuzztime "${{ github.event_name == 'pull_request' && '2m' || '10m' }}" "${{ matrix.pkg }}"
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: "1.26.x"}
      - shell: bash                            # -eo pipefail: a failing benchmark is not hidden by tee
        run: go test -run '^$' -bench . -benchtime "${{ github.event_name == 'pull_request' && '1x' || '1s' }}" ./... | tee -a "$GITHUB_STEP_SUMMARY"
